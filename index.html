<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curso de Algoritmos: Secuencias y Operaciones</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; display: flex; height: 100vh; background: #1e1e1e; color: #fff; }
        #sidebar { width: 340px; background: #252526; border-right: 1px solid #3c3c3c; padding: 15px; overflow-y: auto; }
        .item { padding: 10px; margin-bottom: 6px; background: #2d2d2d; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .item:hover, .item.active { background: #007acc; }
        #main { flex: 1; display: flex; flex-direction: column; }
        #bar { height: 45px; background: #2d2d2d; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; }
        #btn { background: #28a745; color: white; border: none; padding: 8px 16px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        
        #instruccion-container { background: #2d2d2d; padding: 12px 15px; border-bottom: 1px solid #3c3c3c; font-size: 14px; color: #d4d4d4; }
        #instruccion-container strong { color: #4ec9b0; }

        #editor { flex: 2; }
        #output { flex: 1; background: #111; padding: 15px; border-top: 2px solid #3c3c3c; overflow-y: auto; font-family: monospace; }
        .ia-box { background: #3b1818; border-left: 4px solid #f44336; padding: 10px; margin-top: 10px; border-radius: 4px; font-family: sans-serif; white-space: pre-line; }
        .alerta-box { background: #4a3b00; border-left: 4px solid #ffc107; padding: 10px; margin-top: 10px; border-radius: 4px; font-family: sans-serif; color: #fff3cd; }
        .exito-box { background: #1b381e; border-left: 4px solid #28a745; padding: 10px; margin-top: 10px; border-radius: 4px; font-family: sans-serif; color: #d4edda; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/loader.min.js"></script>
</head>
<body>
    <div id="sidebar">
        <h3 style="margin-bottom:10px; color:#4ec9b0;">Módulo 1: Secuencias (30)</h3>
        <div id="lista"></div>
    </div>
    <div id="main">
        <div id="bar">
            <span id="title" style="font-weight:bold;"></span>
            <button id="btn" onclick="ejecutar()">▶ Ejecutar Algoritmo</button>
        </div>
        
        <div id="instruccion-container">
            <strong>Instrucción:</strong> <span id="texto-instruccion">Selecciona un ejercicio</span>
        </div>

        <div id="editor"></div>
        <div id="output">
            <strong>Consola:</strong>
            <pre id="consola" style="color:#aaa; margin-top:5px;"></pre>
            <div id="ia"></div>
        </div>
    </div>

    <script>
        const ejercicios = [
            { id: 1, t: "1. Saludo Básico", instr: "Imprime en pantalla el texto 'Hola, bienvenido al curso de programación'.", code: "# Escribe tu código aquí abajo:\nprint('Hola, bienvenido al curso de programación')" },
            { id: 2, t: "2. Variable Numérica", instr: "Crea una variable llamada 'edad' con valor 20 e imprímela.", code: "edad = 20\n\n# Escribe tu código aquí abajo:\n" },
            { id: 3, t: "3. Suma de Dos Números", instr: "Declara dos variables (a = 5, b = 10), súmalas e imprime el resultado.", code: "a = 5\nb = 10\n\n# Escribe tu código aquí abajo:\n" },
            { id: 4, t: "4. Resta Lineal", instr: "Resta 12 menos 4 e imprime el resultado directamente con print().", code: "# Escribe tu código aquí abajo:\n" },
            { id: 5, t: "5. Multiplicación", instr: "Multiplica 7 por 8 e imprime el resultado.", code: "# Escribe tu código aquí abajo:\n" },
            { id: 6, t: "6. División Exacta", instr: "Divide 20 entre 4 e imprime el resultado.", code: "# Escribe tu código aquí abajo:\n" },
            { id: 7, t: "7. Área de un Rectángulo", instr: "Calcula el área multiplicando base (8) por altura (5) y muestra el resultado.", code: "base = 8\naltura = 5\n\n# Escribe tu código aquí abajo:\n" },
            { id: 8, t: "8. Perímetro de Cuadrado", instr: "Calcula el perímetro multiplicando un lado de valor 6 por 4.", code: "lado = 6\n\n# Escribe tu código aquí abajo:\n" },
            { id: 9, t: "9. Minutos a Segundos", instr: "Convierte 5 minutos a segundos multiplicando por 60.", code: "minutos = 5\n\n# Escribe tu código aquí abajo:\n" },
            { id: 10, t: "10. Mitad de un Número", instr: "Calcula la mitad de la variable 'numero' (valor 50) dividiendo entre 2.", code: "numero = 50\n\n# Escribe tu código aquí abajo:\n" },
            { id: 11, t: "11. El Doble", instr: "Multiplica la variable 'num' (valor 14) por 2 y muéstralo.", code: "num = 14\n\n# Escribe tu código aquí abajo:\n" },
            { id: 12, t: "12. El Triple", instr: "Multiplica la variable 'num' (valor 9) por 3 y muéstralo.", code: "num = 9\n\n# Escribe tu código aquí abajo:\n" },
            { id: 13, t: "13. Suma de Tres", instr: "Suma tres variables numéricas (n1=4, n2=6, n3=10) e imprime el total.", code: "n1 = 4\nn2 = 6\nn3 = 10\n\n# Escribe tu código aquí abajo:\n" },
            { id: 14, t: "14. Promedio Simple", instr: "Calcula el promedio de tres notas (8, 9, 10) sumándolas y dividiendo entre 3.", code: "n1 = 8\nn2 = 9\nn3 = 10\n\n# Escribe tu código aquí abajo:\n" },
            { id: 15, t: "15. Cálculo de Propina", instr: "Calcula el 10% de propina sobre una cuenta de 150 (cuenta * 0.10).", code: "cuenta = 150\n\n# Escribe tu código aquí abajo:\n" },
            { id: 16, t: "16. Descuento del 20%", instr: "Aplica un descuento del 20% a un producto que cuesta 200 (multiplicando por 0.80).", code: "precio = 200\n\n# Escribe tu código aquí abajo:\n" },
            { id: 17, t: "17. Conversión de Moneda", instr: "Convierte 50 dólares a otra moneda multiplicando por una tasa fija de 0.92.", code: "dolares = 50\ntasa = 0.92\n\n# Escribe tu código aquí abajo:\n" },
            { id: 18, t: "18. Cálculo de Velocidad", instr: "Calcula la velocidad dividiendo distancia (100) entre tiempo (2).", code: "distancia = 100\ntiempo = 2\n\n# Escribe tu código aquí abajo:\n" },
            { id: 19, t: "19. Espacio Recorrido", instr: "Calcula el espacio multiplicando velocidad (60) por tiempo (3 horas).", code: "velocidad = 60\ntiempo = 3\n\n# Escribe tu código aquí abajo:\n" },
            { id: 20, t: "20. Intercambio de Variables", instr: "Intercambia los valores de a (3) y b (7) usando una variable auxiliar.", code: "a = 3\nb = 7\n\n# Escribe tu código aquí abajo:\n" },
            { id: 21, t: "21. Área de Triángulo", instr: "Calcula el área multiplicando base (10) por altura (4) y dividiendo entre 2.", code: "base = 10\naltura = 4\n\n# Escribe tu código aquí abajo:\n" },
            { id: 22, t: "22. Longitud Circunferencia", instr: "Calcula la longitud multiplicando 2 por 3.1416 y por el radio (5).", code: "radio = 5\n\n# Escribe tu código aquí abajo:\n" },
            { id: 23, t: "23. Área de Círculo", instr: "Calcula el área del círculo multiplicando 3.1416 por el radio al cuadrado (radio ** 2, radio=3).", code: "radio = 3\n\n# Escribe tu código aquí abajo:\n" },
            { id: 24, t: "24. Sueldo Diario", instr: "Multiplica las horas trabajadas (8) por el pago por hora (12).", code: "horas = 8\npago = 12\n\n# Escribe tu código aquí abajo:\n" },
            { id: 25, t: "25. Sueldo Semanal", instr: "Calcula el sueldo semanal sabiendo que el diario es 96 y se trabajan 5 días.", code: "sueldo_diario = 96\n\n# Escribe tu código aquí abajo:\n" },
            { id: 26, t: "26. Precio con IVA", instr: "Calcula el precio final de un artículo de 150 sumándole el 12% de IVA (precio * 1.12).", code: "precio = 150\n\n# Escribe tu código aquí abajo:\n" },
            { id: 27, t: "27. Datos Personales", instr: "Declara variables 'nombre' ('Ana') y 'edad' (25), e imprímelas juntas.", code: "nombre = 'Ana'\nedad = 25\n\n# Escribe tu código aquí abajo:\n" },
            { id: 28, t: "28. Operación Combinada", instr: "Resuelve la expresión aritmética: 10 + 5 * 2 e imprime el resultado.", code: "# Escribe tu código aquí abajo:\n" },
            { id: 29, t: "29. Días Vividos", instr: "Calcula los días vividos aproximados multiplicando la edad (18 años) por 365.", code: "edad = 18\n\n# Escribe tu código aquí abajo:\n" },
            { id: 30, t: "30. Suma de Tres Variables", instr: "Declara x=10, y=20, z=30 en una sola línea e imprime la suma de las tres.", code: "x, y, z = 10, 20, 30\n\n# Escribe tu código aquí abajo:\n" }
        ];

        let editor;
        const urlBackend = "/ejecutar";

        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs' }});
        require(['vs/editor/editor.main'], function() {
            editor = monaco.editor.create(document.getElementById('editor'), {
                value: ejercicios[0].code,
                language: 'python',
                theme: 'vs-dark',
                lineNumbers: 'on',
                automaticLayout: true,
                insertSpaces: true,
                tabSize: 4,
                trimAutoWhitespace: true
            });
            document.getElementById('texto-instruccion').innerText = ejercicios[0].instr;
            document.getElementById('title').innerText = ejercicios[0].t;
        });

        const listContainer = document.getElementById('lista');
        ejercicios.forEach((ej, index) => {
            const d = document.createElement('div');
            d.className = `item ${index === 0 ? 'active' : ''}`;
            d.innerText = ej.t;
            d.onclick = () => {
                document.querySelectorAll('.item').forEach(i => i.classList.remove('active'));
                d.classList.add('active');
                document.getElementById('title').innerText = ej.t;
                document.getElementById('texto-instruccion').innerText = ej.instr;
                
                document.getElementById('consola').innerText = "";
                document.getElementById('ia').innerHTML = "";
                
                editor.setValue(ej.code);
            };
            listContainer.appendChild(d);
        });

        async function ejecutar() {
            const consoleEl = document.getElementById('consola');
            const iaEl = document.getElementById('ia');
            consoleEl.innerText = "Ejecutando...";
            iaEl.innerHTML = "";

            try {
                const res = await fetch(urlBackend, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ codigo: editor.getValue() })
                });

                const data = await res.json();

                if (data.mensaje_alerta) {
                    consoleEl.innerText = "(Sin salida)";
                    iaEl.innerHTML = `<div class="alerta-box"><strong>⚠️ Atención:</strong><br>${data.mensaje_alerta}</div>`;
                    return;
                }

                consoleEl.innerText = data.salida || "Sin salida de consola";

                if (data.exito && data.mensaje) {
                    iaEl.innerHTML = `<div class="exito-box"><strong>🎉 Mensaje:</strong><br>${data.mensaje}</div>`;
                } else if (!data.exito && data.explicacion_ia) {
                    iaEl.innerHTML = `<div class="ia-box"><strong>🤖 Tutor IA:</strong><br>${data.explicacion_ia}</div>`;
                }
            } catch (e) {
                consoleEl.innerText = "Error conectando al servidor backend.";
            }
        }
    </script>
</body>
</html>
