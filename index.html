<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprende Python 100% Nube</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; display: flex; height: 100vh; background: #1e1e1e; color: #fff; }
        #sidebar { width: 320px; background: #252526; border-right: 1px solid #3c3c3c; padding: 15px; overflow-y: auto; }
        .item { padding: 10px; margin-bottom: 6px; background: #2d2d2d; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .item:hover, .item.active { background: #007acc; }
        #main { flex: 1; display: flex; flex-direction: column; }
        #bar { height: 45px; background: #2d2d2d; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; }
        #btn { background: #28a745; color: white; border: none; padding: 8px 16px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        
        /* Contenedor de la instrucción fuera del editor */
        #instruccion-container { background: #2d2d2d; padding: 12px 15px; border-bottom: 1px solid #3c3c3c; font-size: 14px; color: #d4d4d4; }
        #instruccion-container strong { color: #4ec9b0; }

        #editor { flex: 2; }
        #output { flex: 1; background: #111; padding: 15px; border-top: 2px solid #3c3c3c; overflow-y: auto; font-family: monospace; }
        .ia-box { background: #3b1818; border-left: 4px solid #f44336; padding: 10px; margin-top: 10px; border-radius: 4px; font-family: sans-serif; white-space: pre-line; }
        .alerta-box { background: #4a3b00; border-left: 4px solid #ffc107; padding: 10px; margin-top: 10px; border-radius: 4px; font-family: sans-serif; color: #fff3cd; }
        .exito-box { background: #1b381e; border-left: 4px solid #28a745; padding: 10px; margin-top: 10px; border-radius: 4px; font-family: sans-serif; color: #d4edda; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/loader.min.js"></script>
</head>
<body>
    <div id="sidebar">
        <h3 style="margin-bottom:10px; color:#4ec9b0;">30 Ejercicios IF</h3>
        <div id="lista"></div>
    </div>
    <div id="main">
        <div id="bar">
            <span id="title" style="font-weight:bold;"></span>
            <button id="btn" onclick="ejecutar()">▶ Ejecutar</button>
        </div>
        
        <!-- Panel visible de instrucción -->
        <div id="instruccion-container">
            <strong>Instrucción:</strong> <span id="texto-instruccion">Selecciona un ejercicio</span>
        </div>

        <div id="editor"></div>
        <div id="output">
            <strong>Consola:</strong>
            <pre id="consola" style="color:#aaa; margin-top:5px;"></pre>
            <div id="ia"></div>
        </div>
    </div>

    <script>
        const ejercicios = [
            // BÁSICOS (1 - 10)
            { id: 1, t: "1. Número Positivo", instr: "Si la variable 'numero' es mayor a 0, imprime 'Es positivo'.", code: "numero = 10\n\n# Escribe tu código aquí abajo:\n" },
            { id: 2, t: "2. Mayoría de Edad", instr: "Si 'edad' es mayor o igual a 18, imprime 'Mayor de edad'.", code: "edad = 20\n\n# Escribe tu código aquí abajo:\n" },
            { id: 3, t: "3. Temperatura Alta", instr: "Si 'temp' es superior a 30, imprime 'Hace calor'.", code: "temp = 35\n\n# Escribe tu código aquí abajo:\n" },
            { id: 4, t: "4. Contraseña Correcta", instr: "Si 'clave' es igual a '1234', imprime 'Acceso concedido'.", code: "clave = '1234'\n\n# Escribe tu código aquí abajo:\n" },
            { id: 5, t: "5. Calificación Aprobatoria", instr: "Si 'nota' es mayor o igual a 7, imprime 'Aprobado'.", code: "nota = 8\n\n# Escribe tu código aquí abajo:\n" },
            { id: 6, t: "6. Descuento Disponible", instr: "Si 'monto' es mayor a 100, imprime 'Aplica descuento'.", code: "monto = 150\n\n# Escribe tu código aquí abajo:\n" },
            { id: 7, t: "7. Número Cero", instr: "Si 'num' es exactamente 0, imprime 'El número es cero'.", code: "num = 0\n\n# Escribe tu código aquí abajo:\n" },
            { id: 8, t: "8. Sistema Encendido", instr: "Si 'activo' es True, imprime 'El sistema está activo'.", code: "activo = True\n\n# Escribe tu código aquí abajo:\n" },
            { id: 9, t: "9. Alerta de Velocidad", instr: "Si 'velocidad' supera los 90, imprime 'Exceso de velocidad'.", code: "velocidad = 95\n\n# Escribe tu código aquí abajo:\n" },
            { id: 10, t: "10. Lista No Vacía", instr: "Si 'elementos' tiene más de 0 elementos (usa len), imprime 'La lista tiene datos'.", code: "elementos = [1, 2, 3]\n\n# Escribe tu código aquí abajo:\n" },

            // INTERMEDIOS (11 - 20)
            { id: 11, t: "11. Par o Impar", instr: "Si 'num' es par imprime 'Par', de lo contrario imprime 'Impar'.", code: "num = 7\n\n# Escribe tu código aquí abajo:\n" },
            { id: 12, t: "12. Positivo o Negativo", instr: "Si 'n' es mayor o igual a 0 imprime 'Positivo', sino 'Negativo'.", code: "n = -5\n\n# Escribe tu código aquí abajo:\n" },
            { id: 13, t: "13. Pase de Entrada", instr: "Si 'tiene_ticket' es True imprime 'Bienvenido', sino 'Acceso denegado'.", code: "tiene_ticket = False\n\n# Escribe tu código aquí abajo:\n" },
            { id: 14, t: "14. Comparar Dos Números", instr: "Imprime cuál de los dos números (a o b) es el mayor.", code: "a = 15\nb = 20\n\n# Escribe tu código aquí abajo:\n" },
            { id: 15, t: "15. Validar Usuario", instr: "Si 'usuario' es 'admin' imprime 'Hola Admin', sino 'Hola Usuario'.", code: "usuario = 'invitado'\n\n# Escribe tu código aquí abajo:\n" },
            { id: 16, t: "16. Stock Disponible", instr: "Si 'stock' es mayor a 0 imprime 'Disponible', sino 'Agotado'.", code: "stock = 0\n\n# Escribe tu código aquí abajo:\n" },
            { id: 17, t: "17. Múltiplo de 5", instr: "Si 'num' es múltiplo de 5 imprime 'Múltiplo de 5', sino 'No es múltiplo'.", code: "num = 25\n\n# Escribe tu código aquí abajo:\n" },
            { id: 18, t: "18. Clima Lluvioso", instr: "Si 'lloviendo' es True imprime 'Lleva sombrilla', sino 'Disfruta el día'.", code: "lloviendo = True\n\n# Escribe tu código aquí abajo:\n" },
            { id: 19, t: "19. Longitud de Texto", instr: "Si el texto tiene más de 5 caracteres imprime 'Texto largo', sino 'Texto corto'.", code: "texto = 'Hola'\n\n# Escribe tu código aquí abajo:\n" },
            { id: 20, t: "20. Batería Baja", instr: "Si 'bateria' es menor o igual a 15 imprime 'Conectar cargador', sino 'Batería suficiente'.", code: "bateria = 12\n\n# Escribe tu código aquí abajo:\n" },

            // AVANZADOS (21 - 30)
            { id: 21, t: "21. Clasificar Edad", instr: "Clasifica según 'edad': menor a 12 'Niño', 12-17 'Joven', 18+ 'Adulto'.", code: "edad = 15\n\n# Escribe tu código aquí abajo:\n" },
            { id: 22, t: "22. Sistema de Calificaciones", instr: "Si nota >= 9 'Excelente', si nota >= 7 'Bueno', sino 'Insuficiente'.", code: "nota = 8.5\n\n# Escribe tu código aquí abajo:\n" },
            { id: 23, t: "23. Calculadora de Semáforo", instr: "Según 'color' ('verde', 'amarillo', 'rojo'), imprime la acción recomendada.", code: "color = 'amarillo'\n\n# Escribe tu código aquí abajo:\n" },
            { id: 24, t: "24. Triángulos por Lados", instr: "Dados a, b, c; imprime si es 'Equilátero', 'Isósceles' o 'Escaleno'.", code: "a, b, c = 5, 5, 8\n\n# Escribe tu código aquí abajo:\n" },
            { id: 25, t: "25. Determinar Bisiesto", instr: "Si 'anio' es divisible por 4 y no por 100 (o divisible por 400), imprime 'Bisiesto'.", code: "anio = 2024\n\n# Escribe tu código aquí abajo:\n" },
            { id: 26, t: "26. Descuento por Categoria", instr: "Categoria 'A' (20% desc), 'B' (10% desc), cualquier otra sin descuento.", code: "categoria = 'A'\nprecio = 100\n\n# Escribe tu código aquí abajo:\n" },
            { id: 27, t: "27. Rango de Números", instr: "Verifica si 'num' está entre 10 y 50 inclusive.", code: "num = 30\n\n# Escribe tu código aquí abajo:\n" },
            { id: 28, t: "28. Autenticación Doble", instr: "Si usuario es 'admin' Y pin es 9999, imprime 'Acceso Total', sino 'Denegado'.", code: "usuario, pin = 'admin', 9999\n\n# Escribe tu código aquí abajo:\n" },
            { id: 29, t: "29. Estación del Año", instr: "Según el número de 'mes' (1 al 12), indica a qué estación pertenece.", code: "mes = 6\n\n# Escribe tu código aquí abajo:\n" },
            { id: 30, t: "30. Calculadora IMC", instr: "Dado imc = peso / (altura**2), clasifica: <18.5 'Bajo peso', 18.5-24.9 'Normal', >=25 'Sobrepeso'.", code: "peso = 70\naltura = 1.75\n\n# Escribe tu código aquí abajo:\n" }
        ];

        let editor;
        const urlBackend = "/ejecutar";

        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs' }});
        require(['vs/editor/editor.main'], function() {
            editor = monaco.editor.create(document.getElementById('editor'), {
                value: ejercicios[0].code,
                language: 'python',
                theme: 'vs-dark',
                lineNumbers: 'on',
                automaticLayout: true,
                insertSpaces: true,
                tabSize: 4,
                trimAutoWhitespace: true
            });
            document.getElementById('texto-instruccion').innerText = ejercicios[0].instr;
            document.getElementById('title').innerText = ejercicios[0].t;
        });

        const listContainer = document.getElementById('lista');
        ejercicios.forEach((ej, index) => {
            const d = document.createElement('div');
            d.className = `item ${index === 0 ? 'active' : ''}`;
            d.innerText = ej.t;
            d.onclick = () => {
                document.querySelectorAll('.item').forEach(i => i.classList.remove('active'));
                d.classList.add('active');
                document.getElementById('title').innerText = ej.t;
                document.getElementById('texto-instruccion').innerText = ej.instr;
                
                // Limpiar la consola y mensajes automáticamente al cambiar de ejercicio
                document.getElementById('consola').innerText = "";
                document.getElementById('ia').innerHTML = "";
                
                editor.setValue(ej.code);
            };
            listContainer.appendChild(d);
        });

        async function ejecutar() {
            const consoleEl = document.getElementById('consola');
            const iaEl = document.getElementById('ia');
            consoleEl.innerText = "Ejecutando...";
            iaEl.innerHTML = "";

            try {
                const res = await fetch(urlBackend, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ codigo: editor.getValue() })
                });

                const data = await res.json();

                if (data.mensaje_alerta) {
                    consoleEl.innerText = "(Sin salida)";
                    iaEl.innerHTML = `<div class="alerta-box"><strong>⚠️ Atención:</strong><br>${data.mensaje_alerta}</div>`;
                    return;
                }

                consoleEl.innerText = data.salida || "Sin salida de consola";

                if (data.exito && data.mensaje) {
                    iaEl.innerHTML = `<div class="exito-box"><strong>🎉 Mensaje:</strong><br>${data.mensaje}</div>`;
                } else if (!data.exito && data.explicacion_ia) {
                    iaEl.innerHTML = `<div class="ia-box"><strong>🤖 Tutor IA:</strong><br>${data.explicacion_ia}</div>`;
                }
            } catch (e) {
                consoleEl.innerText = "Error conectando al servidor backend.";
            }
        }
    </script>
</body>
</html>
